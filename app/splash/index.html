<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimLab</title>
<!-- design tokens: copied from web/src/styles/tokens.css when the app is built -->
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--background); color: var(--foreground); font: 14px/1.5 var(--font-sans-family);
         display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
  .box { text-align: center; }
  h1 { font-size: 18px; font-weight: 600; margin: 14px 0 4px; letter-spacing: -0.01em; }
  p { color: var(--muted-foreground); margin: 0; }
  #err { color: var(--destructive); max-width: 420px; margin-top: 12px; white-space: pre-wrap; }
  .bar { width: 160px; height: 3px; border-radius: 3px; background: var(--muted); overflow: hidden; margin: 16px auto 0; }
  .bar i { display: block; width: 40%; height: 100%; background: var(--primary); animation: s 1.1s ease-in-out infinite; }
  .mark path { stroke: var(--primary); } .mark circle { fill: var(--primary); }
  @keyframes s { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
  <div class="box">
    <svg class="mark" width="40" height="40" viewBox="0 0 200 200" aria-hidden="true"><path d="M124.5 55.4A58 58 0 1 1 75.5 55.4" fill="none" stroke-width="22" stroke-linecap="round"/><circle cx="100" cy="40" r="17"/></svg>
    <h1>SimLab</h1>
    <p id="msg">Starting the engine…</p>
    <div class="bar"><i></i></div>
    <p id="err"></p>
  </div>
</body>
</html>

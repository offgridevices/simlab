<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimLab</title>
<style>
  :root { --bg: #14110d; --fg: #f1ece0; --muted: #a89e8e; --ember: #ff6a00; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg: #f7f4ec; --fg: #1b1813; --muted: #6b6456; color-scheme: light; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif;
         display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
  .box { text-align: center; }
  h1 { font-size: 18px; font-weight: 600; margin: 14px 0 4px; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0; }
  #err { color: #f07a5a; max-width: 420px; margin-top: 12px; white-space: pre-wrap; }
  .bar { width: 160px; height: 3px; border-radius: 3px; background: rgba(127,127,127,.2); overflow: hidden; margin: 16px auto 0; }
  .bar i { display: block; width: 40%; height: 100%; background: var(--ember); animation: s 1.1s ease-in-out infinite; }
  @keyframes s { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
  <div class="box">
    <svg width="40" height="40" viewBox="0 0 200 200" aria-hidden="true"><path d="M124.5 55.4A58 58 0 1 1 75.5 55.4" fill="none" stroke="#ff6a00" stroke-width="22" stroke-linecap="round"/><circle cx="100" cy="40" r="17" fill="#ff6a00"/></svg>
    <h1>SimLab</h1>
    <p id="msg">Starting the engine…</p>
    <div class="bar"><i></i></div>
    <p id="err"></p>
  </div>
</body>
</html>

[package]
name = "simlab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "simlab-engine"
path = "src/main.rs"

[dependencies]
simlab-core.workspace = true
simlab-fea.workspace = true
simlab-cfd.workspace = true
simlab-prop.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
tokio = { version = "~1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "fs", "io-util", "io-std", "signal"] }
axum = { version = "=0.8.9", features = ["multipart"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.28.0", features = ["v4"] }
tokio-stream = { version = "0.1", features = ["sync"] }
